name: release

# Release publishes what this project is allowed to publish, and nothing else.
#
# The project's own position (`.planning/PROJECT.md`, "Out of Scope") is that no *distributable* form
# of it may exist: internal-endpoint usage is against X's terms, so no container image, no hosted
# instance, no installer and no package recipe. `internal/audit`'s `distribution` check enforces that.
# A GitHub Release carrying the source and a Go binary, out of a private repository, is the build this
# project already was — it is not a distributable form of it, and this workflow is written to stay on
# that side of the line:
#
#   * no container image is built or pushed,
#   * no package is produced for any distro,
#   * no artifact is uploaded to any registry or package host,
#   * the binaries are attached to this repository's own Release, where a private repository already
#     decides who can fetch them.
#
# The release gate re-runs the project's own audit, so a tag cannot publish a tree whose promises are
# already broken.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "tag to build (must already exist, e.g. v1.0.0)"
        required: true
        type: string

permissions:
  contents: write # the Release and its assets

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: arm64 }
          # Windows builds and is published; it has not been run on Windows by the author. The
          # install helper there is install.ps1, and the README says what is unmeasured.
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
        with:
          # The tag that triggered this run, or the one the manual dispatch names: the build has to
          # come from the tag, not from whatever the branch happens to be.
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: resolve the version
        id: v
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          case "$tag" in
            v*) ;;
            *) echo "release tags are v* (got $tag)"; exit 1 ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      # The gate: the same four checks CI runs, before anything is built for publication.
      - name: go vet
        run: go vet ./...

      - name: gofmt
        run: |
          unformatted="$(gofmt -l internal cmd)"
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt-clean:"; echo "$unformatted"; exit 1
          fi

      - name: go test
        run: CGO_ENABLED=0 go test ./... -count=1

      - name: x-terminal audit
        env:
          HOME: ${{ runner.temp }}
          XDG_CONFIG_HOME: ${{ runner.temp }}/config
          XDG_DATA_HOME: ${{ runner.temp }}/data
        run: |
          mkdir -p "$XDG_CONFIG_HOME" "$XDG_DATA_HOME"
          go run ./cmd/x-terminal audit

      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -eu
          # Windows needs the extension for its loader and for anyone double-clicking the file.
          ext=""
          [ "${GOOS}" = "windows" ] && ext=".exe"
          name="x-terminal_${{ steps.v.outputs.tag }}_${GOOS}_${GOARCH}${ext}"
          mkdir -p dist
          CGO_ENABLED=0 go build \
            -trimpath \
            -ldflags "-s -w \
              -X github.com/${{ github.repository }}/internal/cli.version=${{ steps.v.outputs.tag }} \
              -X github.com/${{ github.repository }}/internal/cli.commit=${{ steps.v.outputs.commit }}" \
            -o "dist/${name}" ./cmd/x-terminal
          # One checksum per artifact, in its own file: a Release's assets are the only thing a
          # downloader can verify, and a checksum that arrives in the same archive as the binary
          # proves nothing.
          (cd dist && sha256sum "${name}" > "${name}.sha256")
          # The binary names itself before it is published: a release asset that cannot say which
          # tag it is would make every bug report ambiguous.
          #
          # And only where this runner can execute it. A cross-compiled target cannot be run here
          # — an amd64 runner has neither qemu-user for the aarch64 ELF nor the Darwin loader for
          # the Mach-O — and `exec` then fails with 126 under `set -e`, taking the whole leg with
          # it. That is what the first v1.1.0 run did: the native linux/amd64 leg passed and both
          # cross legs (linux/arm64, darwin/arm64) died with exit code 126 before the publish job,
          # so no Release was created. The self-check therefore runs on the native leg, and a cross
          # leg asserts the artifact it built is there and executable instead.
          if [ "$(go env GOHOSTOS)/$(go env GOHOSTARCH)" = "${GOOS}/${GOARCH}" ]; then
            "dist/${name}" --version
          else
            test -x "dist/${name}"
            echo "cross-compiled for ${GOOS}/${GOARCH}: the self-check ran on the native leg"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: x-terminal_${{ matrix.goos }}_${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: ship the install helpers beside the binaries
        run: |
          # The two installer-shaped files the project permits, one per platform family, and the
          # audit names both: each only downloads these assets, verifies the published digest and
          # installs under the user's home.
          cp install.sh dist/install.sh
          cp install.ps1 dist/install.ps1
          (cd dist && sha256sum install.sh > install.sh.sha256 && sha256sum install.ps1 > install.ps1.sha256)

      - name: assemble the checksum file
        run: |
          cd dist
          # Every artifact's own .sha256, concatenated: one file a downloader can run
          # `sha256sum -c` against, plus the per-asset files beside the assets.
          cat ./*.sha256 | sort -k2 > SHA256SUMS
          ls -la

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: release notes from the changelog of record
        id: notes
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          {
            echo "Read-only x.com client for a terminal pane — source and Go binaries for \`${tag}\`."
            echo
            echo "**What this is.** A single-user, local tool. It talks to x.com's internal web"
            echo "endpoints with the browser's own session cookie, through the operator's proxy, and"
            echo "renders timelines, threads, search, profiles and the saved lists as plain text."
            echo
            echo "**What this is not.** It is not a distributable product: no container image, no"
            echo "hosted instance, no package recipe. Using those endpoints is against X's terms, so"
            echo "the intended use is the author's own machines and accounts."
            echo
            echo "**Install.** One command, which picks this machine's asset, verifies its published"
            echo "digest and puts it in \`\$HOME/.local/bin\`:"
            echo
            echo '```'
            echo "curl -fsSLO https://github.com/LZD121/x-terminal/releases/latest/download/install.sh"
            echo "sh install.sh"
            echo '```'
            echo
            echo "Then \`x-terminal login\` and \`x-terminal doctor\`; \`RUNBOOK.md\` covers the rest."
            echo
            echo "Windows: run \`install.ps1\` instead (PowerShell 5.1+). The Windows builds are"
            echo "published but unmeasured: colours need TERM set, media opening needs a configured"
            echo "opener, and there are no in-terminal images."
            echo
            echo "Requirements: Linux, macOS or Windows, a route to x.com (the runbook covers a local"
            echo "proxy), and a terminal — the pane is plain text by design."
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag exists: uploading its assets"
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" \
              --title "$tag" \
              --notes-file RELEASE_NOTES.md \
              --verify-tag \
              dist/*
          fi
